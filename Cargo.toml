[workspace]
resolver = "2"
# `spike/` is a deliberately SEPARATE workspace (its own Cargo.lock), excluded here
# so its future O1 dense-backend candidates (usearch, Qdrant Edge — T10-03/04) never
# enter this workspace's lockfile. That isolation is what keeps the "no dense SDK
# before T10" guardrail (CONTRIBUTING.md) mechanically checkable through G17.
exclude = ["spike"]
members = [
    "crates/core",
    "crates/store",
    "crates/index",
    "crates/projection",
    "crates/embed",
    "crates/models",
    "crates/generate",
    "crates/search",
    "crates/memory",
    "crates/protocol",
    "crates/local-rag",
    "crates/local-rag-proxy",
    "crates/local-rag-hook",
    "crates/local-rag-tui",
    "crates/test-support",
    "crates/xtask",
]
# `xtask` and `test-support` are dev-only: exclude them from the default set so root
# `cargo build` / `cargo run` touch only product crates. `cargo test
# --workspace` (run by `cargo xtask ci`) still covers them.
default-members = [
    "crates/core",
    "crates/store",
    "crates/index",
    "crates/projection",
    "crates/embed",
    "crates/models",
    "crates/generate",
    "crates/search",
    "crates/memory",
    "crates/protocol",
    "crates/local-rag",
    "crates/local-rag-proxy",
    "crates/local-rag-hook",
    "crates/local-rag-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
# T17-03: required by `cargo dist generate` to emit a GitHub Actions release
# workflow (release-artifact download URLs, badge links). The repo is public
# — GitHub's own "Trade controls restricted owner" account-level restriction
# blocked *private* repo creation specifically; public succeeded.
repository = "https://github.com/13W/memory"

# Centralized lints; each crate opts in via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
