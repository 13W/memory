[package]
name = "local-rag-spike-harness"
description = "Backend-neutral conformance + benchmark harness for the T10 dense-backend spike (open question O1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Path deps into the product workspace: the harness runs candidates through the
# *same* `[FIXED]` ProjectionStore contract the product uses (spec 05 §1), and the
# fake backend is the first candidate exercised (it is a real working backend).
local-rag-core = { path = "../../crates/core" }
local-rag-projection = { path = "../../crates/projection" }
# Typed spike-report (de)serialization; `deny_unknown_fields` makes deserialization
# the schema check (same idiom as `crates/index`'s fixture models, T04-03). Both
# are already approved in the product workspace, so no new crate family enters here.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T10-03: the second real dense-backend spike candidate (open question O1).
# Apache-2.0, same as this project's other approved dependencies. Default
# features stay on (pulls the `numkong` SIMD-kernel crate, also Apache-2.0,
# same author/org) so the measured warm-search p95 reflects a realistic
# configuration, not an artificially unaccelerated build. Compiles its C++
# core via `cxx-build`/`cc` (verified locally: a C++17 toolchain is present) —
# this is the first spike dependency needing a native compiler; `fake`/
# `brute-force` needed none. Deliberately confined to THIS lockfile
# (`spike/Cargo.lock`), never the product workspace's — see this crate's own
# header comment and CONTRIBUTING.md § Dependency policy.
usearch = "2.26"

[lints]
workspace = true
