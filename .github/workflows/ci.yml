name: ci

on:
  push:
  pull_request:

# The full check runs on one host target (T00-02); `windows` below covers the
# one other target that is built for release but never otherwise compiled here.
jobs:
  check:
    name: full check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        # rust-toolchain.toml drives the exact channel + components.
        run: rustup show
      - name: Install cargo-nextest
        # cargo xtask ci runs its test jobs through nextest (parallel
        # test-binary execution) instead of `cargo test`; see CONTRIBUTING.md.
        run: cargo install cargo-nextest --locked
      - name: Run full check
        run: cargo xtask ci

  windows:
    name: windows release build
    runs-on: windows-latest
    # D-112: nothing compiled this target between tags, so a Windows break
    # stayed invisible until a release ran — and then it was a failed release,
    # not a failed check. Two of them at once, in fact: a `#[cfg(unix)]` gap in
    # `cli/vacuum.rs` that had been on `master` since X-012, and a llama.cpp
    # link failure that arrived with a GitHub runner image bump
    # (windows-2022 20260707.563 -> 20260819.586) under an unchanged
    # `llama-cpp-sys-2 0.1.152`. The second one is why this job exists in this
    # shape rather than as a cheaper check.
    #
    # `build`, not `check`: `cargo check` does not link, and the failure that
    # actually cost the release was `link.exe exit 1120` — twenty-odd
    # unresolved UCRT imports. A `check` job would have been green through all
    # of it.
    #
    # `--profile dist`: that profile is what `cargo-dist` builds a release
    # with, and it is not `release` — it inherits from it and adds
    # `lto = "thin"`. Building anything else here would make this job an
    # approximation of the thing it exists to predict.
    #
    # Two steps, because the two failures they catch are not the same failure.
    #
    # The `dist` build covers the four shipped binaries and is the only thing
    # here that links. The `check --all-targets` step covers everything else in
    # the workspace, tests included, and deliberately does NOT use `--profile
    # dist`: the defect class it exists for (D-113) is `#[cfg(unix)]` items
    # reached from ungated code, which surfaces as `E0433`/`E0425` during name
    # resolution. `cargo check` sees those, and building every test binary with
    # `lto = "thin"` to see the same errors would cost minutes for nothing.
    #
    # Do not collapse these into one `cargo build --all-targets --profile dist`.
    # It would be slower and would catch nothing the pair does not.
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Build the shipped binaries
        run: >
          cargo build --profile dist
          -p local-rag -p local-rag-proxy -p local-rag-hook -p local-rag-tui
      - name: Check every target, tests included
        run: cargo check --workspace --all-targets

  architecture:
    name: architecture model
    runs-on: ubuntu-latest
    # The LikeC4 model in docs/architecture is only useful while it is true, and
    # both ways it goes stale are silent. A malformed view still renders in the
    # editor the author had open; a renamed module leaves a `code` reference
    # pointing at nothing, which no Rust check and no linter looks at.
    #
    # No package.json is vendored for this (an explicit decision — the model is
    # authored with a globally installed CLI), so the version is pinned here
    # instead. Keep it in step with the one named in docs/architecture/README.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the model
        run: npx -y likec4@1.59.2 validate docs/architecture
      - name: Check that every spec, plan and code reference resolves
        run: node docs/architecture/check-refs.mjs
