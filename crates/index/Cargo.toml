[package]
name = "local-rag-index"
description = "Code indexing / reconcile layer for local-rag (scaffold)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
local-rag-core = { path = "../core" }
local-rag-store = { path = "../store" }

# gitignore matching (spec 06 §2). See the dependency policy in CONTRIBUTING.md
# for the justification, license, and the recorded transitive set. T03-02 uses the
# `ignore::gitignore` matcher; T05-02 adds the authoritative tree walk
# (`ignore::WalkBuilder`) for the reconcile candidate manifest. `default-features =
# false` is set defensively (the crate's only feature is opt-in `simd-accel`;
# `WalkBuilder`/`Walk` are core API, available without it).
ignore = { version = "0.4", default-features = false }

# The incremental parser (spec 06 §2.1 `[FIXED]` tree-sitter) and the first-release
# TypeScript grammar (ADR-0001). Pinned as a compatible pair: the grammar declares
# `tree-sitter ^0.24`, so the core is held at 0.24 (no grammar targets 0.25/0.26
# yet). See the dependency policy / allowlist in CONTRIBUTING.md. tree-sitter 0.24
# yields query matches as a `StreamingIterator`, so `streaming-iterator` is a
# direct dependency to drive it.
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
# The second-release language grammar (ADR-0001, T04-04). Pinned at 0.23 (not the
# newer 0.25) for ABI compatibility: `tree-sitter-javascript 0.25` ships an ABI-15
# grammar that `tree-sitter 0.24` (max supported ABI 14) refuses to load, whereas
# 0.23.x is ABI 14 — the same reason `tree-sitter-typescript` is held at 0.23. Its
# only runtime dependency is `tree-sitter-language` (already in the tree, shared
# with `tree-sitter`), so it adds no new transitive crate. See the dependency
# allowlist in CONTRIBUTING.md.
tree-sitter-javascript = "0.23"
# The third-release language grammar (ADR-0001 dogfooding, T04-05). Pinned at 0.23
# (ABI 14) for the same reason as the other two grammars: `tree-sitter-rust 0.24+`
# ships an ABI-15 grammar that `tree-sitter 0.24` (max supported language ABI 14)
# refuses to load — it would silently degrade to a file-only parse; 0.23.x is ABI 14
# (the ABI-15 bump landed in the grammar's 0.24.0). Its only runtime dependency is
# `tree-sitter-language` (already in the tree, shared with `tree-sitter`), so it adds
# no new transitive crate. See the dependency allowlist in CONTRIBUTING.md.
tree-sitter-rust = "0.23"
streaming-iterator = "0.1"

# Runtime primitives for the reconcile scheduler/driver (T05-04, spec 06 §1): the
# `select!` loop (macros), per-worktree task spawning (rt), debounce/periodic timers
# (time), and the trigger channel (sync). `crates/store` links only `sync` (the
# bounded write queue); the daemon (T15) selects the runtime flavor. See the
# dependency policy / allowlist in CONTRIBUTING.md.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
] }
# Cross-platform filesystem watcher (spec 06 §1: "Watcher (`notify`) events"; the
# `[FIXED]` principle is watcher = hint, reconcile = truth). `std` has no FS
# notification API. Live watching is confined to `reconcile::watcher`; the pure
# `WatchEvent → Trigger` mapping is what tests cover. `default-features = false`
# drops the `crossbeam-channel` default (std `mpsc` suffices for the thin wrapper)
# and keeps the transitive set minimal, mirroring `ignore`. See the dependency
# allowlist in CONTRIBUTING.md.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# Optional, dev-only path crate (0 external sources): enabled ONLY by the
# `failpoints` feature so the generation builder can host named crash/error
# injection points at each build phase (spec 06 §2, T05-05 retry/failure
# handling). Off by default → zero-cost; the release/distribution build never
# links the test-support crate. Mirrors `crates/store`.
local-rag-test-support = { path = "../test-support", optional = true }

[features]
# Compile the generation builder's named failpoint seams (spec 04 §1 build →
# failed edge, T05-05). Off by default → zero-cost, and the release/distribution
# build never links the test-support crate.
failpoints = ["dep:local-rag-test-support"]

[dev-dependencies]
local-rag-test-support = { path = "../test-support" }
# The reconcile/scheduler integration tests drive the store's async bounded writer
# and the scheduler's debounce timers, so the harness needs a runtime, the
# `#[tokio::test]` macro, and paused virtual time (`start_paused`/`advance`).
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "test-util",
] }
# T04-03 is the first task to consume typed JSON fixtures (spec 14 §1 parser
# family). `serde(derive)` is already approved (crates/core); `serde_json` is
# dev-only here so the shipped binary is unaffected. Typed models with
# `#[serde(deny_unknown_fields)]` make deserialization the schema check.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
