[package]
name = "local-rag"
description = "local-rag daemon + CLI (scaffold; multiplexed per spec 13 §1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# T17-03: one of the three product binaries dist actually ships (spec 13 §1).
# `publish = false` (workspace-wide — this project is not published to
# crates.io) otherwise hides every package from dist by default.
[package.metadata.dist]
dist = true

[dependencies]
local-rag-core = { path = "../core" }
local-rag-store = { path = "../store" }
local-rag-index = { path = "../index" }
local-rag-projection = { path = "../projection" }
local-rag-memory = { path = "../memory" }
local-rag-protocol = { path = "../protocol" }
local-rag-embed = { path = "../embed" }
local-rag-generate = { path = "../generate" }
# T15-03: the MCP code-query tools call `SearchEngine` directly (spec 09,
# T12-04). 0 new external sources — `local-rag-search` itself only depends
# on `core`/`protocol`/`store`/`projection`, all already in this crate's own
# dependency graph.
local-rag-search = { path = "../search" }
# `local-rag init [--download-models]` (spec 11 §6, D-013) needs the installer
# and the ONNX provider directly — the CLI is the only production caller of
# either (`local-rag-models`'s own doc comment names this task as owner). The
# heavy transitive deps (`ort`/`tokenizers`/`ndarray`/`ureq`) stay confined to
# that one crate, same as every other consumer of it.
local-rag-models = { path = "../models" }
# The daemon (T15-01) is the first product binary that owns a *full* tokio
# executor: every library crate below it (store/index/memory/embed) deliberately
# stops at `rt`/`sync`/`time` (task_local!/timeout only — see each crate's own
# Cargo.toml comment, "the daemon (T15) still selects the runtime flavor").
# `rt-multi-thread`: the daemon's own executor. `net`: the store-lock liveness
# probe and the MCP UDS listener (spec 02 §2.1, §4.1). `signal`: SIGTERM/CTRL-C
# shutdown (spec 02 §4.3). `time`: the idle-shutdown timer and the bounded
# liveness-probe timeout. `sync`: `watch`/`oneshot` for daemon-mode/shutdown
# signaling (already resolved transitively via local-rag-store; a direct edge
# here since this crate uses it directly too). `io-util`: `AsyncWriteExt` for
# the handshake-stub greeting write. `macros`: `#[tokio::main]`/`#[tokio::test]`.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "signal",
    "time",
    "sync",
    "io-util",
    "macros",
] }
# `store.lock` JSON (spec 02 §2: "flock'd JSON: {instance_uuid, pid,
# daemon_version, started_at}") and the store-liveness-probe greeting line.
# Already resolved via local-rag-core/local-rag-store — 0 new external sources.
serde = { version = "1", features = ["derive"] }
# `raw_value`: `daemon::handshake` passes the opaque MCP JSON-RPC payload
# through as `Box<RawValue>` (see `local-rag-protocol`'s `handshake` module
# doc for why plain `serde_json::Value` would not do) — T15-02.
serde_json = { version = "1", features = ["raw_value"] }
# `rusqlite::Error` appears in this crate's own error types (the resume
# drivers surface a stale-run-set read failure directly). Same
# version/features as `local-rag-store` — 0 new external sources, only a
# direct edge for the type name.
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
# `kill(pid, SIGTERM)` is not exposed by `std::process::Child::kill` (unix-only
# SIGKILL). Test-only use (dev-dependency below) sends a real SIGTERM for the
# "SIGTERM at safe points" acceptance test; see CONTRIBUTING's dependency
# table (`local-rag-core` was previously the sole `libc` consumer).
libc = "0.2"

[dev-dependencies]
local-rag-test-support = { path = "../test-support" }

[features]
# Compiles in a single test-only pause knob the resume drivers check before
# finishing a job (an env-var-read delay, not the shared `Failpoints`
# registry — there is exactly one call site, so the registry's declare/arm
# machinery would add ceremony without benefit). Off by default → zero-cost;
# the release/distribution build never compiles it in, mirroring
# `local-rag-hook`'s identical `failpoints` feature.
#
# T17-04: also forwards to `local-rag-store/failpoints`, which gates this
# crate's own `daemon_version`/migration-set env-var overrides (see
# `main.rs::test_daemon_version_override`, `local-rag-store`'s
# `state::test_migration_set_override`) — a real compiled `local-rag serve`
# process configured two ways stands in for "two binary versions" in the
# cross-binary-version upgrade test (`local-rag-proxy/tests/subprocess.rs`),
# since there is no real second historical binary/machine available.
failpoints = ["local-rag-store/failpoints"]

[lints]
workspace = true
