[package]
name = "local-rag-embed"
description = "Embedding provider pool for local-rag: local-first Embedder providers, policy guard, retry/fallback (spec 10 §1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
local-rag-core = { path = "../core" }
local-rag-protocol = { path = "../protocol" }
local-rag-store = { path = "../store" }
# Optional, dev-only path crate (0 external sources): enabled ONLY by the
# `failpoints` feature so the backfill worker can host its named crash point
# between committed batches (spec 10 §4 step 2's "resumable"; T11-04's
# crash-resume test). Off by default → zero-cost; the release/distribution build
# never links the test-support crate. Mirrors `store`/`index`/`projection`.
local-rag-test-support = { path = "../test-support", optional = true }

[features]
# Compiles `embed.backfill.between_batches`, the crash point fired after a
# non-empty cache-write transaction commits — the same placement
# `local_rag_store::retention`'s sweep uses for `retention.sweep.between_batches`.
failpoints = ["dep:local-rag-test-support"]

[dev-dependencies]
local-rag-test-support = { path = "../test-support" }
# The v1 provider retry/backoff contract (spec 10 §1 "inherited from the v1
# behavioral contract") is imported as typed fixtures — `fixtures/fault/index.json`,
# family `fault.llm.*`. Deserializing them with `#[serde(deny_unknown_fields)]`
# makes the fixture schema the test's own schema check, exactly like
# `crates/index`'s parser goldens. Dev-only: the shipped binary never links it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One test drives the store's real effective-policy fold, whose write path is
# `StateWriter::transaction` (an async fn in `crates/store`), so its test needs
# an executor. Dev-only, exactly like `crates/projection`'s and
# `crates/search`'s; the library itself pulls no tokio dependency.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }

[lints]
workspace = true
