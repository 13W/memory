[package]
name = "local-rag-proxy"
description = "local-rag thin stdio MCP proxy (spec 13 §1's per-session multiplexed model)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# T17-03: one of the three product binaries dist actually ships (spec 13 §1).
[package.metadata.dist]
dist = true

[dependencies]
local-rag-core = { path = "../core" }
local-rag-protocol = { path = "../protocol" }
# T15-02: `rt`: `Builder::new_current_thread()` (a single UDS connection
# relaying stdin/stdout is entirely IO-bound — "thin" per spec 11 §1, no
# multi-thread executor earns its keep here). `net`: the UDS connection to
# the daemon. `time`: backoff sleeps, the connect-or-spawn budget, and the
# 30s upgrade `wait_for_close` timeout. `signal`: this proxy's own
# SIGTERM/CTRL-C listener (spec 13 §2). `io-util`/`io-std`: bounded line I/O
# over the UDS connection and stdin/stdout. `sync`: `oneshot` for its own
# `ShutdownSignal`-pattern copy. `macros`: `#[tokio::test]`.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "net",
    "time",
    "signal",
    "io-util",
    "io-std",
    "sync",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
# `raw_value`: relays the opaque MCP JSON-RPC payload byte-exact — see
# `local-rag-protocol`'s `handshake` module doc for why plain
# `serde_json::Value` would not do.
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(unix)'.dependencies]
# `process_group(0)` (detached daemon spawn, spec 13 §2) and `kill(pid,
# SIGTERM)` (real-subprocess tests) — same precedent as `local-rag`'s own
# `libc` dependency.
libc = "0.2"

[dev-dependencies]
local-rag-test-support = { path = "../test-support" }
# Dev-only, not a runtime dependency of the shipped proxy binary (see this
# crate's own `main.rs` doc on holding no project state): needed so
# `tests/subprocess.rs`'s real end-to-end scenarios can spawn a genuine
# `local-rag serve` binary, built as part of this workspace test build.
# `env!("CARGO_BIN_EXE_local-rag")` does NOT resolve it, despite that being
# the pattern for the *current* package's own binaries elsewhere in this
# workspace — Cargo does not set `CARGO_BIN_EXE_<name>` for another
# package's binary just because it is a (dev-)dependency (verified
# empirically, T17-04; corrected here — `local-rag-hook/tests/recall_rpc.rs`
# already documents the identical finding). `tests/subprocess.rs`'s own
# `local_rag_binary_path()` instead locates the binary next to the test
# binary itself (`target/<profile>/<name>`, one directory up from
# `target/<profile>/deps/`), the same "ships side by side" layout spec 13 §1
# describes and `connect::resolve_daemon_binary_path` relies on at runtime.
local-rag = { path = "../local-rag" }
# Dev-only, same reasoning as `local-rag` immediately above — T18-08's
# `tests/admin_telemetry.rs` needs a real `local-rag-hook` binary alongside
# the real `local-rag serve`/`local-rag-proxy` it already spawns, to prove
# the daemon's telemetry tells the hook's recall RPC and the proxy's relayed
# calls apart by `source`. One new edge, not two: this crate already carries
# the `local-rag` sibling-binary-path trick as a dev-dependency, so only
# `local-rag-hook` itself is missing here (a test living in
# `local-rag-hook/tests/` instead would need dev-deps on *both*
# `local-rag-proxy` and `local-rag`, since `CARGO_BIN_EXE_<name>` never
# resolves transitively through another package's own dev-dependency).
local-rag-hook = { path = "../local-rag-hook" }
# `test-util`: paused virtual time (`start_paused`/`advance`) for the
# connect-backoff and 30s-upgrade-timeout tests — the only deterministic,
# non-wall-clock way to exercise real `tokio::time::sleep`/`timeout`.
tokio = { version = "1", default-features = false, features = ["test-util"] }

[features]
# T17-04: no test-only code of this crate's own is gated by this — it exists
# purely to forward into the dev-dependency `local-rag`'s identical
# `failpoints` feature (which gates its `daemon_version`/migration-set
# env-var overrides), so `tests/subprocess.rs`'s cross-binary-version upgrade
# test can spawn a real `local-rag serve` process configured to behave like
# "an old daemon". Off by default, so a plain `cargo test -p local-rag-proxy`
# is unaffected.
failpoints = ["local-rag/failpoints"]

[lints]
workspace = true
