[package]
name = "local-rag-projection"
description = "Dense/FTS projection layer for local-rag (backend-neutral contract + fake backend)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
local-rag-core = { path = "../core" }
# The write-ahead switch (T07-03, spec 05 §5) reads/writes `state.sqlite`:
# `worktree_projection_state` (T07-02 guards), the generation machine, and
# `worktree.current_generation_id` — all owned by `local-rag-store`. No new
# external dependency; `rusqlite` types are used via `local_rag_store::rusqlite`.
local-rag-store = { path = "../store" }
# First normal-dependency tokio use in this crate (T09-02, spec 02 §5 L3):
# `ShardManager`'s single-flight cell is `tokio::sync::OnceCell` and its
# rebuild throttle is `tokio::sync::Semaphore` (both behind the `sync`
# feature); background-rebuild cancellation needs `tokio::spawn`/
# `task::AbortHandle` (behind `rt`). `rt`/`sync` add no transitive crate of
# their own — tokio is already resolved via `local-rag-store` (whose own
# `rt` addition, T09-01, made the same "0 new external packages" argument).
# No runtime is constructed here; this crate only ever borrows one already
# running (the daemon's, group 15, or `#[tokio::test]`'s in tests).
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }
# Optional, dev-only path crate (0 external sources): enabled ONLY by the
# `failpoints` feature so the fake shard can host named crash-injection points
# for the projection fault matrix (F1–F12, spec 05 §10; authored in T07-05).
# Never enabled in release/dist. Mirrors `store`'s wiring.
local-rag-test-support = { path = "../test-support", optional = true }

[features]
# Compile the fake backend's named failpoint seams plus its inspect/corrupt
# test controls (spec 05 §10, 14 §3). Off by default → zero-cost, and the
# release/distribution build never links the test-support crate.
failpoints = ["dep:local-rag-test-support"]

[dev-dependencies]
local-rag-test-support = { path = "../test-support" }
# The switch's `state.sqlite` writer (`StateWriter::transaction`) is async; tests
# drive it with `#[tokio::test]`, mirroring `crates/store`'s dev-dependency shape.
# `sync` is added by T07-05's `fault_matrix.rs`: several async tests in one
# binary arm the process-global failpoint registry, so they need an
# async-aware mutex (`tokio::sync::Mutex`) to serialize — a plain
# `std::sync::Mutex` guard held across `.await` is itself a bug
# (`clippy::await_holding_lock`, see `switch_faults.rs`'s doc comment).
# `time` is added by T09-04's `switch_concurrency.rs`: a `tokio::time::timeout`
# wrap around the concurrent-switch load test makes "no deadlock" an explicit,
# assertable property instead of relying on an external CI-level timeout.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }

[lints]
workspace = true
