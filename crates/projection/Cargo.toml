[package]
name = "local-rag-projection"
description = "Dense/FTS projection layer for local-rag (backend-neutral contract + fake backend)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
local-rag-core = { path = "../core" }
# Optional, dev-only path crate (0 external sources): enabled ONLY by the
# `failpoints` feature so the fake shard can host named crash-injection points
# for the projection fault matrix (F1–F12, spec 05 §10; authored in T07-05).
# Never enabled in release/dist. Mirrors `store`'s wiring.
local-rag-test-support = { path = "../test-support", optional = true }

[features]
# Compile the fake backend's named failpoint seams plus its inspect/corrupt
# test controls (spec 05 §10, 14 §3). Off by default → zero-cost, and the
# release/distribution build never links the test-support crate.
failpoints = ["dep:local-rag-test-support"]

[dev-dependencies]
local-rag-test-support = { path = "../test-support" }

[lints]
workspace = true
