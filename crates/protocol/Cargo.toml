[package]
name = "local-rag-protocol"
description = "Proxy/daemon + MCP protocol types for local-rag (scaffold)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
local-rag-core = { path = "../core" }
# T12-03: spec 09 §7 fixes the `search_code` response JSON, so `Serialize`
# derives here implement a spec'd shape rather than inventing a wire format —
# and they make "repeated output is byte-stable" a real byte comparison instead
# of a proxy for it. Already approved and already in `Cargo.lock` (used by
# `core`/`store`/`index`/`models`), so this adds zero packages.
serde = { version = "1", features = ["derive"] }
# T15-02: the proxy <-> daemon wire protocol itself (`handshake` module) —
# promoted from dev-only (T12-03 used it only to assert byte-stable JSON
# shape) to a real dependency, since both sides of the handshake now actually
# send and parse this crate's types over a live connection. `raw_value`:
# `Box<RawValue>` carries the opaque MCP JSON-RPC payload byte-exact through
# `RequestEnvelope`/`ResponseEnvelope` without this crate ever parsing MCP
# semantics — see `handshake.rs`'s own module doc for why plain
# `serde_json::Value` would not do. Already approved, already resolved
# throughout the workspace — this adds a feature flag, not a new package.
serde_json = { version = "1", features = ["raw_value"] }

[lints]
workspace = true
