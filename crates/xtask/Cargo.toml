[package]
name = "xtask"
description = "Developer task runner for local-rag (dev-only; not distributed)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# T12-05's `bench` subcommand runs the real pipeline end to end: index the
# corpus, embed it, project it, then search it. Every crate here is already a
# workspace member, so this adds **no** package to `Cargo.lock` — only build
# time for a dev-only crate that is excluded from `default-members`.
local-rag-core = { path = "../core" }
local-rag-store = { path = "../store" }
local-rag-index = { path = "../index" }
local-rag-projection = { path = "../projection" }
local-rag-embed = { path = "../embed" }
local-rag-models = { path = "../models" }
local-rag-protocol = { path = "../protocol" }
local-rag-search = { path = "../search" }
# T14-07's `memory-bench` subcommand runs the router benchmark end to end
# against the real installed GGUF weights.
local-rag-memory = { path = "../memory" }
local-rag-generate = { path = "../generate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
# T17-05's `release-report` subcommand measures a real `local-rag serve`
# process's idle RSS (spec 14 §2's `resources` gate) — `std` exposes no
# process memory introspection at all. `default-features = false` +
# `system` keeps this to exactly `System`/`Process` (no `disk`/`network`/
# `component`/`user` probing, none of which this task needs). Chosen over
# raw `libc::getrusage`/platform `#[cfg]` branches specifically because it
# also covers `win32-x64` (a real target, spec 01 §2) in one API, not just
# the four Unix release targets a `ps`-shell-out would reach. See
# `CONTRIBUTING.md`'s "Approved external dependencies" table for the full
# scope/license note.
sysinfo = { version = "0.39", default-features = false, features = [
    "system",
] }
# `local-rag-test-support` (`TempHome`, real-subprocess helpers): originally
# only a dev-dependency for `dist_ort`'s own tests (isolated temp roots, the
# same convention `crates/models`'s installer tests use); promoted to a real
# dependency at T17-05, whose `release-report` subcommand spawns a real
# `local-rag serve` subprocess to measure idle RAM — production command
# logic now, not only `#[cfg(test)]` code.
local-rag-test-support = { path = "../test-support" }

[dev-dependencies]
# Only to build a one-member `.tgz` in `dist_ort`'s own test fixture. That
# fixture used to shell out to `tar -czf`, on the argument that it should build
# its archive with the same tool the code under test extracted with; T22-15
# removed the system `tar` from that code, so the argument went with it.
# Building the bytes in-process is also one less thing about the host that a
# test result depends on.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
