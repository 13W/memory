[package]
name = "xtask"
description = "Developer task runner for local-rag (dev-only; not distributed)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# T12-05's `bench` subcommand runs the real pipeline end to end: index the
# corpus, embed it, project it, then search it. Every crate here is already a
# workspace member, so this adds **no** package to `Cargo.lock` — only build
# time for a dev-only crate that is excluded from `default-members`.
local-rag-core = { path = "../core" }
local-rag-store = { path = "../store" }
local-rag-index = { path = "../index" }
local-rag-projection = { path = "../projection" }
local-rag-embed = { path = "../embed" }
local-rag-models = { path = "../models" }
local-rag-protocol = { path = "../protocol" }
local-rag-search = { path = "../search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }

[lints]
workspace = true
