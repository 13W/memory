[package]
name = "local-rag-store"
description = "Durable storage layer for local-rag (state.sqlite / cache.sqlite)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
local-rag-core = { path = "../core" }
# `bundled` compiles SQLite from source: reproducible, offline builds and a
# self-contained binary with no system libsqlite3 dependency (spec 13 §1/§2).
rusqlite = { version = "0.40", features = ["bundled"] }
# `sync`: bounded `mpsc` + `oneshot` for the write queue (spec 02 §5 L4). No
# net/mio in the library; the blocking SQLite writer lives on a dedicated OS
# thread driven via `Receiver::blocking_recv`. `rt`: `tokio::task_local!`
# (`lock::order`, T09-01, spec 02 §5 lock-order tracking) lives behind tokio's
# own `rt` feature; `rt = []` in tokio's manifest adds no transitive crate —
# only more of tokio's own code compiles in — so this still pulls no
# runtime/net/mio dependency. `time`: `tokio::time::timeout` for the bounded
# L2.read wait (`lock::worktree::read_bounded`, T09-03, spec 02 §6
# "search waits on L2.read (bounded); timeout → BUSY_RETRY") — like `rt`, adds
# no transitive crate, only more of tokio's own code.
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time"] }
# Exact-byte `source_blob` compression (spec 03 §2.3 `source_compression='zstd'`,
# 12 §5). Vendors libzstd from source via `zstd-sys`/`cc` — bundled/offline like
# rusqlite's SQLite. `std` has no zstd. See CONTRIBUTING allowlist.
zstd = "0.13"
# Unicode NFC for the versioned content_blob text normalization
# (`normalization_version=1`, spec 03 §1.3/§4.2, T03-04). std has no Unicode
# normalization. Already in Cargo.lock via local-rag-core (0 new external
# sources). See CONTRIBUTING allowlist.
unicode-normalization = "0.1"
# Unicode simple case folding for the FTS tokenizer's "lowercased" token
# emission (spec 09 §2, T08-01) — the same primitive local-rag-core already
# uses for case-insensitive path identity. std's `to_lowercase` is full
# Unicode lowering (can expand length); `simple_fold` is a strict 1:1 fold.
# Already in Cargo.lock via local-rag-core (0 new external sources). See
# CONTRIBUTING allowlist.
casefold = "0.1"
# `model_space.coverage` advisory JSON (spec 03 §2.2, 10 §3, T11-01): a small,
# fixed-shape map (representation kind -> {expected,ready,failed}). Hand-rolling
# a JSON encoder/decoder for a nested map is disproportionate and error-prone
# next to a well-audited, ubiquitous crate; `derive` types `CoverageEntry`
# directly. Already in the workspace's dependency graph via `local-rag-core`
# (`serde` with `derive`), so only `serde_json` itself is new to the lockfile.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Optional, dev-only path crate (0 external sources): enabled ONLY by the
# `failpoints` feature so the migration runner can host named crash-injection
# points for hard-kill (SIGABRT) resume tests. Never enabled in release/dist.
local-rag-test-support = { path = "../test-support", optional = true }

[features]
# Compile the migration runner's named failpoint seams (spec 13 §3 crash tests).
# Off by default → zero-cost, and the release/distribution build never links the
# test-support crate.
failpoints = ["dep:local-rag-test-support"]

[dev-dependencies]
local-rag-test-support = { path = "../test-support" }
# Test harness needs a runtime (incl. the blocking pool for `spawn_blocking`)
# and the `#[tokio::test]` macro. `time`/`test-util`: paused virtual time
# (`start_paused`/`advance`) for `read_bounded`'s timeout test (T09-03) — the
# only deterministic, non-wall-clock way to exercise a real `tokio::time::timeout`.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "test-util",
] }

[lints]
workspace = true
