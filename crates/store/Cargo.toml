[package]
name = "local-rag-store"
description = "Durable storage layer for local-rag (state.sqlite / cache.sqlite)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
local-rag-core = { path = "../core" }
# `bundled` compiles SQLite from source: reproducible, offline builds and a
# self-contained binary with no system libsqlite3 dependency (spec 13 §1/§2).
rusqlite = { version = "0.40", features = ["bundled"] }
# Only the `sync` feature: bounded `mpsc` + `oneshot` for the write queue
# (spec 02 §5 L4). No runtime/net/mio in the library; the blocking SQLite
# writer lives on a dedicated OS thread driven via `Receiver::blocking_recv`.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
local-rag-test-support = { path = "../test-support" }
# Test harness needs a runtime (incl. the blocking pool for `spawn_blocking`)
# and the `#[tokio::test]` macro.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
] }

[lints]
workspace = true
