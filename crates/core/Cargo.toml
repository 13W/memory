[package]
name = "local-rag-core"
description = "Foundational types shared across local-rag crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Identity primitives (spec 03 §1.2/§1.3). See the dependency policy in
# CONTRIBUTING.md for the per-crate justification and license check.
#
# blake3: the content/manifest/subject identity hash (spec 03 §1.2). `pure`
# forces portable Rust — no `cc`/assembly SIMD — so the native link set is just
# blake3 + arrayref/arrayvec/cfg-if/constant_time_eq. std is disabled (we only
# need the no_std hashing + `to_hex`).
# unicode-normalization: NFC for path canonicalization (spec 03 §1.3); std has
# no Unicode normalization.
# casefold: Unicode simple case folding (spec 03 §1.3) for case-insensitive
# filesystems; std offers only full case mapping (lowercasing), not simple fold.
# toml + serde: parse the versioned global config `<config_dir>/config.toml`
# (spec 02 §3.1). std has no TOML parser; hand-rolling one for a security-relevant
# config (data_policy) is disproportionate and error-prone. serde `derive` types
# the sections; parsing is lenient (unknown keys ignored), version/enum validation
# is explicit in `config::Config`.
# serde_json: the LRSP frame payload (spec 07 §3, `spool::FramePayload`, T13-03 —
# relocated from `local-rag-hook`, already a consumer since T13-02). Already
# resolved via `local-rag-store`/`local-rag-search`/etc. — 0 new external sources.
[dependencies]
blake3 = { version = "1", default-features = false, features = ["pure"] }
unicode-normalization = "0.1"
casefold = "0.1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `geteuid` for POSIX owner verification (spec 02 §2.1). std exposes no getuid;
# libc is a rust-lang-maintained, zero-transitive-dependency crate. See the
# dependency policy in CONTRIBUTING.md.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
local-rag-test-support = { path = "../test-support" }

[lints]
workspace = true
