[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# The archive format for non-Windows targets (T22-07, ADR-0013). `.tar.gz` and not
# the `.tar.xz` default because `node:zlib` has gzip and inflate and will never
# have xz: `npm/memory/src/archive.js` must unpack this with built-ins alone, on
# minimal images where GNU tar's external `xz` helper is not installed.
unix-archive = ".tar.gz"
# Windows keeps `.zip`, which was already the default — stated rather than implied
# so both extensions live in one place next to the consumer that assumes them.
windows-archive = ".zip"
# GitHub artifact attestation (T22-17, ADR-0013). The ADR is explicit that the
# `.sha256` sidecar defends against corruption in transit and tampering on the
# wire, and NOT against a compromised release — "an attacker who can publish the
# asset can publish its digest" — and names attestation as the mitigation. This
# is the producing half: the `build-local-artifacts` job gains
# `attestations: write` / `id-token: write` and an `actions/attest@v4` step, and
# the generated release notes tell a reader how to check one with
# `gh attestation verify`.
#
# One thing about the generated step that was checked rather than trusted: its
# `subject-path` is `target/distrib/*${{ join(matrix.targets, ', ') }}*`, and a
# job carrying two targets would produce the glob `*a, b*`, which matches
# nothing and would attest silently nothing at all. `dist plan` says every
# matrix entry here has exactly one target, so the glob is a bare triple and
# matches that job's archives. Worth re-checking if the target list ever grows a
# multi-target runner.
#
# Set here rather than by editing `.github/workflows/release.yml`, which carries
# "This file was autogenerated by dist" at the top: a hand-edit there survives
# exactly until the next `dist generate`, which is the kind of change that
# disappears without anyone noticing it has.
#
# The consuming half — `npm/memory` verifying an attestation before it trusts a
# downloaded binary — is deliberately NOT done, and is registered as a deviation
# rather than left implied: it would need `gh` or a sigstore library, and this
# installer's whole stance is built-ins only (`archive.js`, `http.js`).
github-attestations = true

# No README/LICENSE/CHANGELOG alongside the executable. `archive.js` rejects an
# archive with more than one member, and without this that rule would hold only
# because this repository happens to have no such files at its root: adding one
# would silently put a second member into every release archive.
#
# Since 2026-08-31 the repository DOES have a root `LICENSE` and `NOTICE`
# (Apache-2.0), so this line is now load-bearing rather than latent, and the
# licence consequence is stated here rather than discovered later. A release
# archive carries exactly one member — the executable — and therefore no licence
# copy. That is acceptable because the archive is not what a user installs: it is
# fetched by `npm/memory`, whose published package carries `LICENSE` (npm includes
# it regardless of the `files` allowlist), so the recipient of a binary does
# receive the licence alongside it. If the archives ever become a direct download
# channel, this decision has to be revisited together with `archive.js`'s
# single-member rule.
auto-includes = false

# Build only what is actually shipped. Without this, `cargo-dist` builds with
# `cargo build --workspace`, which compiles every crate in the repository —
# including `xtask`, a development-only crate that is neither in
# `default-members` nor marked `dist = true` and appears in no release asset.
#
# It was not free. In the failed `0.1.0` run (D-112) `xtask` reached the linker
# on `x86_64-pc-windows-msvc` and died there, adding a second, unrelated red
# block to a log that already carried the real one.
#
# Read what this does and does not fix. It stops building a crate nothing ships,
# and it shortens every release. It does NOT fix that link error: `xtask` pulls
# `llama-cpp-sys-2` through `local-rag-generate`, and so does the shipped
# `local-rag` binary (`crates/local-rag/Cargo.toml` depends on it
# unconditionally). Whatever makes llama.cpp link on MSVC has to be fixed on its
# own terms; this line only stops an unshipped crate from being the first to
# report it.
precise-builds = true
